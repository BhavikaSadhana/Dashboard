<!DOCTYPE html>
<html>
  <head>
    <title>Hello World!</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <form id="registerForm">
        <br />
        <h1 style="color: purple; margin-left: 20%">Register Page</h1>
        <input
          type="text"
          id="username"
          name="username"
          required
          placeholder="username"
        />
        <input
          type="password"
          id="password"
          name="password"
          required
          placeholder="password"
        />
        <input
          type="password"
          id="repassword"
          name="repassword"
          required
          placeholder="repassword"
        />
        <br />
        <button type="submit">Register</button>
      </form>
      <p style="text-align: center">
        Do you have an account? <a href="login.html">Login here</a>
      </p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
